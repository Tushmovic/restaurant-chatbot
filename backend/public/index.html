<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieBot Restaurant Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            min-height: 100vh; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            max-width: 800px; 
            width: 100%;
            background: white; 
            border-radius: 25px; 
            box-shadow: 0 25px 75px rgba(255, 105, 135, 0.4); 
            overflow: hidden;
            animation: floatIn 0.6s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header { 
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%); 
            color: white; 
            padding: 35px; 
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: float 20s linear infinite;
        }
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-20px, -20px) rotate(360deg); }
        }
        .header h1 { 
            font-size: 2.8rem; 
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
        }
        .header p { 
            opacity: 0.95; 
            font-size: 1.1rem;
            position: relative;
        }
        .emoji-float {
            position: absolute;
            font-size: 2rem;
            animation: floatUp 6s infinite linear;
            opacity: 0.7;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        .chat-container { 
            padding: 30px; 
            max-height: 500px; 
            overflow-y: auto;
            background: linear-gradient(to bottom, #f8f9ff, #f0f2ff);
        }
        .message { 
            margin-bottom: 20px; 
            padding: 18px; 
            border-radius: 20px; 
            animation: messagePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            max-width: 85%;
            word-wrap: break-word;
        }
        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .bot { 
            background: linear-gradient(135deg, #6C63FF 0%, #8A7EFF 100%);
            color: white; 
            border-left: 5px solid #4A44C6;
            margin-right: auto;
        }
        .user { 
            background: linear-gradient(135deg, #FF8A00 0%, #FFB347 100%); 
            color: white; 
            margin-left: auto;
            border-right: 5px solid #E67E00;
            border-left: none;
        }
        .options { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px; 
            margin-top: 25px;
            padding: 0 30px 30px;
            background: white;
        }
        .option-btn { 
            padding: 18px; 
            background: white; 
            border: 3px solid #FFD166; 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 16px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-align: left;
            font-weight: 600;
            color: #333;
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s;
        }
        .option-btn:hover::before {
            left: 100%;
        }
        .option-btn:hover { 
            background: linear-gradient(135deg, #FFD166 0%, #FFB347 100%); 
            color: white; 
            border-color: #FFB347; 
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 179, 71, 0.3);
        }
        .option-btn:active {
            transform: translateY(-2px) scale(1);
        }
        .option-number { 
            display: inline-block; 
            width: 36px; 
            height: 36px; 
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%); 
            color: white; 
            border-radius: 50%; 
            text-align: center; 
            line-height: 36px; 
            margin-right: 12px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(255, 107, 107, 0.3);
        }
        .order-summary { 
            background: linear-gradient(135deg, #06D6A0 0%, #1B9AAA 100%);
            color: white;
            padding: 25px; 
            border-radius: 15px; 
            margin: 25px 30px; 
            border-left: 6px solid #118AB2;
            box-shadow: 0 10px 25px rgba(6, 214, 160, 0.2);
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .footer { 
            padding: 25px; 
            text-align: center; 
            background: linear-gradient(135deg, #073B4C 0%, #118AB2 100%);
            color: #FFFFFF; 
            border-top: 3px solid #06D6A0;
            font-weight: 500;
        }
        .footer p {
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .payment-btn {
            background: linear-gradient(135deg, #EF476F 0%, #FF9A8B 100%) !important;
            color: white !important;
            border-color: #EF476F !important;
            font-size: 1.1rem !important;
            padding: 20px !important;
        }
        .back-btn {
            background: linear-gradient(135deg, #118AB2 0%, #06D6A0 100%) !important;
            color: white !important;
            border-color: #118AB2 !important;
        }
        
        /* Scrollbar Styling */
        .chat-container::-webkit-scrollbar {
            width: 10px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #FF8E53 0%, #FF6B6B 100%);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { margin: 10px; border-radius: 20px; }
            .header { padding: 25px; }
            .header h1 { font-size: 2.2rem; }
            .chat-container, .options { padding: 20px; }
            .options { grid-template-columns: 1fr; }
            .message { max-width: 90%; padding: 15px; }
        }
        
        /* Loading animation */
        .loading-dots {
            display: inline-block;
        }
        .loading-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #FF6B6B;
            margin: 0 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ FoodieBot Restaurant</h1>
            <p>AI-powered food ordering chatbot • Fast & Delicious! 🚀</p>
            <!-- Floating emojis -->
            <div class="emoji-float" style="left: 10%; animation-delay: 0s;">🍕</div>
            <div class="emoji-float" style="left: 30%; animation-delay: 1s;">🍔</div>
            <div class="emoji-float" style="left: 50%; animation-delay: 2s;">🥗</div>
            <div class="emoji-float" style="left: 70%; animation-delay: 3s;">🍦</div>
            <div class="emoji-float" style="left: 90%; animation-delay: 4s;">🥤</div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot" id="welcomeMessage">
                Welcome to FoodieBot! How can I help you today? 
                <div class="loading-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
        
        <div id="orderSummary" class="order-summary" style="display: none;">
            <!-- Order summary will be shown here -->
        </div>
        
        <div class="options" id="optionsContainer">
            <!-- Options will be added here by JavaScript -->
        </div>
        
        <div class="footer">
            <p>Alaya Restaurant ChatBot • Test Card: 4242 4242 4242 4242 • Enjoy your meal! 😋</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let sessionId = localStorage.getItem('chatbot_session_id') || generateSessionId();
        let currentOrder = null;
        
        // Check payment status from URL when page loads
        function checkPaymentStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentStatus = urlParams.get('payment');
            const orderId = urlParams.get('orderId');
            const reference = urlParams.get('reference');
            
            if (paymentStatus === 'success') {
                addMessage('🎉 <strong>Payment Successful!</strong><br>Your order has been confirmed and is being prepared.', 'bot');
                addMessage('📧 You will receive an email confirmation shortly. Thank you for your order!', 'bot');
                showOptions([
                    { value: '1', label: '🍽️ Place New Order' },
                    { value: '98', label: '📜 View Order History' }
                ]);
                // Clear URL parameters
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (paymentStatus === 'failed') {
                addMessage('❌ <strong>Payment Failed</strong><br>Your payment could not be processed.', 'bot');
                showOptions([
                    { value: 'pay', label: '🔄 Retry Payment' },
                    { value: '1', label: '🍽️ Start New Order' }
                ]);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            // If there's a reference in URL, verify payment
            if (reference) {
                verifyPayment(reference);
            }
        }
        
        function generateSessionId() {
            const id = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chatbot_session_id', id);
            return id;
        }
        
        function addMessage(text, sender) {
            const container = document.getElementById('chatContainer');
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            message.innerHTML = text;
            container.appendChild(message);
            container.scrollTop = container.scrollHeight;
        }
        
        function showOptions(options) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                if (option.value === 'pay') {
                    button.classList.add('payment-btn');
                }
                if (option.value === '1' && option.label.includes('Back')) {
                    button.classList.add('back-btn');
                }
                button.innerHTML = `<span class="option-number">${option.value}</span> ${option.label}`;
                button.onclick = () => handleOptionSelect(option.value);
                container.appendChild(button);
            });
        }
        
        async function handleOptionSelect(value) {
            addMessage(`<strong>You selected:</strong> ${value}`, 'user');
            
            try {
                switch(value) {
                    case '1':
                        await showMenu();
                        break;
                    case '97':
                        await getCurrentOrder();
                        break;
                    case '99':
                        await checkoutOrder();
                        break;
                    case '98':
                        await getOrderHistory();
                        break;
                    case '0':
                        await cancelOrder();
                        break;
                    case 'pay':
                        await initiatePayment();
                        break;
                    default:
                        if (parseInt(value) >= 1 && parseInt(value) <= 10) {
                            await addToOrder(value);
                        }
                        break;
                }
            } catch (error) {
                addMessage('❌ <strong>Error:</strong> ' + error.message, 'bot');
            }
        }
        
        async function showMenu() {
            try {
                addMessage('📋 <strong>Our Delicious Menu:</strong><br>Select items by number:', 'bot');
                const response = await fetch(API_BASE + '/chat/menu');
                const data = await response.json();
                showOptions(data.items);
            } catch (error) {
                addMessage('❌ Could not load menu. Please try again.', 'bot');
            }
        }
        
        async function addToOrder(itemId) {
            try {
                const response = await fetch(API_BASE + '/chat/add-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, itemId })
                });
                const data = await response.json();
                addMessage('✅ ' + data.message, 'bot');
                setTimeout(getCurrentOrder, 1000);
            } catch (error) {
                addMessage('❌ Could not add item to order.', 'bot');
            }
        }
        
        async function getCurrentOrder() {
            try {
                const response = await fetch(API_BASE + `/chat/current-order/${sessionId}`);
                const data = await response.json();
                
                if (data.order && data.order.items.length > 0) {
                    let summary = '<h3>🛒 Current Order:</h3>';
                    data.order.items.forEach(item => {
                        summary += `<p>${item.name} × ${item.quantity} - <strong>₦${item.price * item.quantity}</strong></p>`;
                    });
                    summary += `<p style="margin-top: 10px; border-top: 2px solid white; padding-top: 10px;"><strong>Total: ₦${data.order.totalAmount}</strong></p>`;
                    
                    document.getElementById('orderSummary').innerHTML = summary;
                    document.getElementById('orderSummary').style.display = 'block';
                    
                    if (data.options) showOptions(data.options);
                } else {
                    addMessage(data.message || '🛒 Your cart is empty.', 'bot');
                    showOptions([{ value: '1', label: '🍽️ Place New Order' }]);
                }
            } catch (error) {
                addMessage('❌ Could not load current order.', 'bot');
            }
        }
        
        async function checkoutOrder() {
            addMessage('💳 <strong>Processing checkout...</strong>', 'bot');
            
            try {
                const response = await fetch(API_BASE + `/chat/checkout/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (data.type === 'checkout') {
                    addMessage('✅ <strong>' + data.message + '</strong>', 'bot');
                    
                    if (data.paymentRequired && data.order) {
                        currentOrder = data.order;
                        
                        // Show order summary
                        let summary = '<h3>📋 Order Summary:</h3>';
                        data.order.items.forEach(item => {
                            summary += `<p>${item.name} × ${item.quantity} - <strong>₦${item.price * item.quantity}</strong></p>`;
                        });
                        summary += `<p style="margin-top: 10px; border-top: 2px solid white; padding-top: 10px;"><strong>Total Amount: ₦${data.order.totalAmount}</strong></p>`;
                        
                        const orderDiv = document.getElementById('orderSummary');
                        orderDiv.innerHTML = summary;
                        orderDiv.style.display = 'block';
                        
                        // Show payment options
                        showOptions([
                            { value: 'pay', label: `💳 Pay ₦${data.order.totalAmount} Now` },
                            { value: '1', label: '➕ Add More Items' },
                            { value: '0', label: '❌ Cancel Order' }
                        ]);
                    } else {
                        addMessage('No payment required.', 'bot');
                        showOptions(data.options || [{ value: '1', label: '🍽️ Place New Order' }]);
                    }
                } else if (data.type === 'message') {
                    addMessage(data.message, 'bot');
                    showOptions(data.options || [{ value: '1', label: '🍽️ Place New Order' }]);
                }
                
            } catch (error) {
                addMessage('❌ Checkout error: ' + error.message, 'bot');
                showOptions([{ value: '1', label: '🔄 Try Again' }]);
            }
        }
        
        async function initiatePayment() {
            const email = prompt('Enter email for payment receipt:', 'customer@example.com');
            if (!email) {
                addMessage('❌ Email is required for payment.', 'bot');
                return;
            }
            
            try {
                addMessage('🔄 <strong>Initializing payment...</strong>', 'bot');
                
                const response = await fetch(API_BASE + '/payment/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId,
                        orderId: currentOrder._id || currentOrder.id,
                        email,
                        amount: currentOrder.totalAmount
                    })
                });
                
                const data = await response.json();
                
                if (data.authorization_url) {
                    // Open payment in new window
                    const paymentWindow = window.open(data.authorization_url, 'Paystack Payment', 'width=600,height=700,scrollbars=yes');
                    
                    if (!paymentWindow) {
                        addMessage('❌ Please allow pop-ups to proceed with payment.', 'bot');
                        return;
                    }
                    
                    addMessage('🔗 <strong>Payment window opened!</strong><br>Please complete payment in the new window.', 'bot');
                    
                    // Check payment status every 3 seconds
                    const checkPayment = setInterval(async () => {
                        if (paymentWindow.closed) {
                            clearInterval(checkPayment);
                            addMessage('🔄 <strong>Verifying payment...</strong>', 'bot');
                            await verifyPayment(data.reference);
                        }
                    }, 3000);
                } else {
                    addMessage('❌ Payment initialization failed. Please try again.', 'bot');
                }
            } catch (error) {
                addMessage('❌ Payment error: ' + error.message, 'bot');
            }
        }
        
        async function verifyPayment(reference) {
            try {
                const response = await fetch(API_BASE + `/payment/verify/${reference}`);
                const data = await response.json();
                
                if (data.success) {
                    addMessage(`🎉 <strong>Payment Successful!</strong><br>Amount: ₦${data.amount}<br>Reference: ${data.reference}`, 'bot');
                    addMessage('✅ Your order has been confirmed. Thank you!', 'bot');
                    showOptions([
                        { value: '1', label: '🍽️ Place New Order' },
                        { value: '98', label: '📜 View Order History' }
                    ]);
                } else {
                    addMessage('❌ <strong>Payment Failed</strong><br>' + data.message, 'bot');
                    showOptions([
                        { value: 'pay', label: '🔄 Retry Payment' },
                        { value: '1', label: '🍽️ Start New Order' }
                    ]);
                }
            } catch (error) {
                addMessage('❌ Error verifying payment: ' + error.message, 'bot');
            }
        }
        
        async function getOrderHistory() {
            try {
                const response = await fetch(API_BASE + `/chat/order-history/${sessionId}`);
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    let historyText = '<h3>📜 Order History:</h3>';
                    data.history.slice(0, 5).forEach((order, index) => {
                        const date = new Date(order.createdAt).toLocaleDateString('en-US', {
                            weekday: 'short',
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        });
                        historyText += `<p>${index + 1}. ${date} - <strong>₦${order.totalAmount}</strong> (${order.status})</p>`;
                    });
                    addMessage(historyText, 'bot');
                } else {
                    addMessage('📭 No order history found.', 'bot');
                }
                showOptions([{ value: '1', label: '🍽️ Place New Order' }]);
            } catch (error) {
                addMessage('❌ Could not load order history.', 'bot');
            }
        }
        
        async function cancelOrder() {
            try {
                const response = await fetch(API_BASE + `/chat/cancel-order/${sessionId}`, {
                    method: 'POST'
                });
                const data = await response.json();
                addMessage('✅ ' + data.message, 'bot');
                if (data.options) showOptions(data.options);
            } catch (error) {
                addMessage('❌ Could not cancel order.', 'bot');
            }
        }
        
        async function loadWelcome() {
            document.getElementById('orderSummary').style.display = 'none';
            try {
                const response = await fetch(API_BASE + '/chat/welcome');
                const data = await response.json();
                document.getElementById('welcomeMessage').innerHTML = data.message;
                showOptions(data.options);
            } catch (error) {
                document.getElementById('welcomeMessage').innerHTML = 'Welcome to FoodieBot! How can I help you today?';
                showOptions([
                    { value: '1', label: '🍽️ Place an order' },
                    { value: '99', label: '💳 Checkout order' },
                    { value: '98', label: '📜 See order history' },
                    { value: '97', label: '🛒 See current order' },
                    { value: '0', label: '❌ Cancel order' }
                ]);
            }
        }
        
        // Start the chat
        document.addEventListener('DOMContentLoaded', function() {
            checkPaymentStatus();
            setTimeout(loadWelcome, 1000);
        });
    </script>
</body>
</html>
