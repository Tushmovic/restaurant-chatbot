<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment - FoodieBot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .content {
            padding: 30px;
        }
        .order-summary {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .summary-item:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.2rem;
            color: #667eea;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .pay-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #06D6A0 0%, #1B9AAA 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 214, 160, 0.3);
        }
        .pay-button:active {
            transform: translateY(0);
        }
        .test-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            color: #856404;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Complete Payment</h1>
            <p>FoodieBot Restaurant</p>
        </div>
        
        <div class="content">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
            
            <div id="orderSummary" class="order-summary">
                <p>Loading order details...</p>
            </div>
            
            <form id="paymentForm">
                <div class="form-group">
                    <label for="email">Email for receipt</label>
                    <input type="email" id="email" required 
                           placeholder="your.email@example.com"
                           value="customer@example.com">
                </div>
                
                <button type="submit" class="pay-button" id="payButton">
                    Pay with Paystack
                </button>
            </form>
            
            <div class="test-info">
                <strong>Test Mode:</strong><br>
                • Email: any valid email<br>
                • Test Card: 4242 4242 4242 4242<br>
                • Expiry: Any future date<br>
                • CVV: Any 3 digits
            </div>
            
            <div class="loading" id="loading">
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p>Processing payment...</p>
            </div>
            
            <div class="back-link">
                <a href="/" id="backLink">← Back to Chat</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        
        // Get order details from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const sessionId = urlParams.get('sessionId');
        
        // Check for payment status in URL
        const paymentStatus = urlParams.get('payment');
        const reference = urlParams.get('reference');
        
        if (paymentStatus === 'success') {
            showSuccess(reference);
            return;
        } else if (paymentStatus === 'failed') {
            showError('Payment failed. Please try again.');
        }
        
        if (!orderId || !sessionId) {
            showError('Missing order information. Please go back and try again.');
            disableForm();
            return;
        }
        
        let currentOrder = null;
        
        // Load order details
        async function loadOrderDetails() {
            try {
                showLoading(true);
                const response = await fetch(`${API_BASE}/chat/current-order/${sessionId}`);
                const data = await response.json();
                
                if (data.order) {
                    currentOrder = data.order;
                    displayOrderSummary(data.order);
                } else {
                    showError('Order not found. Please go back and try again.');
                    disableForm();
                }
            } catch (error) {
                console.error('Error loading order:', error);
                showError('Error loading order details.');
                disableForm();
            } finally {
                showLoading(false);
            }
        }
        
        function displayOrderSummary(order) {
            const container = document.getElementById('orderSummary');
            let html = `<h3>Order Summary</h3>`;
            
            order.items.forEach((item, index) => {
                html += `
                <div class="summary-item">
                    <span>${item.name} × ${item.quantity}</span>
                    <span>₦${item.price * item.quantity}</span>
                </div>`;
            });
            
            html += `
            <div class="summary-item">
                <span>Total Amount</span>
                <span>₦${order.totalAmount}</span>
            </div>`;
            
            container.innerHTML = html;
        }
        
        // Handle payment form submission
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            if (!email) {
                showError('Please enter your email for payment receipt');
                return;
            }
            
            if (!currentOrder) {
                showError('Order not found');
                return;
            }
            
            // Show loading
            showLoading(true);
            document.getElementById('payButton').disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/payment/initialize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId,
                        orderId: currentOrder._id || orderId,
                        email,
                        amount: currentOrder.totalAmount
                    })
                });
                
                const data = await response.json();
                
                if (data.authorization_url) {
                    // Redirect to Paystack payment page
                    window.location.href = data.authorization_url;
                } else {
                    throw new Error('Payment initialization failed');
                }
                
            } catch (error) {
                console.error('Payment error:', error);
                showError('Payment initialization failed. Please try again.');
                
                // Hide loading
                showLoading(false);
                document.getElementById('payButton').disabled = false;
            }
        });
        
        function showSuccess(reference) {
            const container = document.querySelector('.content');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px 20px;">
                    <div style="font-size: 60px; color: #06D6A0; margin-bottom: 20px;">✅</div>
                    <h2 style="color: #06D6A0; margin-bottom: 20px;">Payment Successful!</h2>
                    <p style="margin-bottom: 30px; font-size: 18px;">
                        Your order has been confirmed and is being prepared.
                    </p>
                    <p style="margin-bottom: 30px;">
                        Order Reference: ${reference || 'N/A'}
                    </p>
                    <a href="/" style="display: inline-block; padding: 15px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 10px; font-weight: bold;">
                        Return to Chat
                    </a>
                </div>
            `;
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('payButton').style.display = show ? 'none' : 'block';
        }
        
        function disableForm() {
            document.getElementById('payButton').disabled = true;
            document.getElementById('email').disabled = true;
        }
        
        // Initialize
        window.onload = loadOrderDetails;
    </script>
</body>
</html>
